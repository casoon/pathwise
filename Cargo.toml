[package]
name = "pathwise"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Generic search, optimization, and constraint-solving building blocks for Rust"
license = "MIT"
repository = "https://github.com/casoon/pathwise"

[package.metadata.docs.rs]
# docs.rs otherwise builds with `default = []`, leaving the `petgraph`
# integration undocumented.
all-features = true

[features]
default = []
petgraph = ["dep:petgraph"]

[dependencies]
petgraph = { version = "0.7", optional = true }


[dev-dependencies]
criterion = "0.5"
proptest = "1.5"

[[bench]]
name = "search_benches"
harness = false

[[bench]]
name = "constraint_benches"
harness = false

